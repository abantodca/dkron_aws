[defaults]
inventory            = inventories/prod
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = ansible.builtin.default
result_format        = yaml
forks                = 5
pipelining           = True
timeout              = 30
deprecation_warnings = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s