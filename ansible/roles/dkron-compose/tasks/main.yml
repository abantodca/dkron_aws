---
- name: Crear directorios
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ dkron_dir }}"
    - "{{ dkron_data_volume }}"

- name: Renderizar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dkron_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Reiniciar compose

- name: Renderizar .env (con DSN y configuración runtime)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dkron_dir }}/.env"
    mode: "0600"   # solo root lee — contiene el DSN
    owner: root
  no_log: true
  notify: Reiniciar compose

- name: Pull de la imagen pinneada
  community.docker.docker_compose_v2_pull:
    project_src: "{{ dkron_dir }}"
  tags: [deploy]

- name: Up del compose (idempotente)
  community.docker.docker_compose_v2:
    project_src: "{{ dkron_dir }}"
    state: present
    pull: missing                # solo pull si no la tiene local
    remove_orphans: true
  tags: [deploy]

- name: Esperar a que Dkron responda en :8080
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    timeout: 90
  tags: [deploy, smoke]

- name: Smoke test — GET /v1/jobs
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/v1/jobs
    status_code: 200
  register: smoke
  retries: 6
  delay: 5
  until: smoke.status == 200
  tags: [deploy, smoke]