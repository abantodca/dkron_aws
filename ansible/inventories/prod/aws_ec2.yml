---
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:Project: dkron
  tag:Environment: prod
  instance-state-name: running
keyed_groups:
  - prefix: tag_Role
    key: ec2_tags.Role
hostnames:
  - tag:Name
compose:
  # OJO: en 'compose' cada valor es una expresión Jinja2.
  # Para literales string hay que envolverlos en comillas dentro de la expresión.
  # 'ansible_aws_ssm_bucket_name' se define en group_vars/all.yml porque los
  # lookups dentro de 'compose' del plugin aws_ec2 no se resuelven de forma
  # fiable y dejan la variable en None (rompe el conector aws_ssm).
  ansible_host: instance_id
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_python_interpreter: "'/usr/bin/python3'"
