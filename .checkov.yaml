---
# Checkov config — proyecto bootcamp Dkron sobre AWS.
#
# Los checks listados aquí se omiten a propósito. Cada bloque explica el porqué
# para que el reviewer entienda la decisión sin tener que abrir cada modulo.
# Lo que SÍ se puede fijar sin costo extra ya está aplicado en los .tf
# (IMDSv2, ebs_optimized, drop_invalid_header_fields, SecureString SSM, etc.).

directory:
  - infra/

quiet: true
compact: true

skip-check:
  # ─── Sin dominio / ACM: el ALB sirve HTTP plano. Aplicaría en prod real ────
  - CKV_AWS_2     # ALB protocol HTTPS
  - CKV_AWS_103   # TLS >= 1.2 (sólo HTTPS)
  - CKV_AWS_378   # LB target no debe usar HTTP
  - CKV2_AWS_20   # ALB redirect HTTP -> HTTPS

  # ─── Costo recurrente desproporcionado para un lab ─────────────────────────
  - CKV2_AWS_28   # WAF en ALB público
  - CKV2_AWS_11   # VPC flow logs (CW/S3 facturados continuo)
  - CKV_AWS_91    # ALB access logs (S3 + CW)
  - CKV_AWS_65    # ECS Container Insights
  - CKV_AWS_338   # CW Logs retention >= 1 año (lab se destruye al final)

  # ─── CMK KMS añade ~1 USD/mes por clave; AWS-managed alcanza ───────────────
  - CKV_AWS_136   # ECR KMS CMK
  - CKV_AWS_145   # S3 KMS CMK
  - CKV_AWS_158   # CW Logs KMS CMK
  - CKV_AWS_184   # EFS KMS CMK
  - CKV_AWS_337   # SSM SecureString con CMK
  - CKV_AWS_173   # Lambda env vars con CMK (TOPIC_ARN no es secreto)

  # ─── ALB / arquitectura del lab ────────────────────────────────────────────
  - CKV_AWS_150   # ALB deletion_protection (bloquearía terraform destroy)
  - CKV_AWS_130   # Subnets públicas asignan IP pública (intencional: ALB+NAT viven ahí)

  # ─── Security groups: patrones estándar AWS dentro de la VPC ───────────────
  - CKV_AWS_382   # Egress 0.0.0.0/0 :-1 (necesario para NAT/SSM/ECR/Prom scrape)
  - CKV_AWS_260   # Ingress 80 desde Internet (ALB público sin HTTPS)
  - CKV_AWS_24    # Ingress 22 (regla dinámica activada sólo con CIDRs explícitos)

  # ─── Lambda alertmgr-to-sns: glue de 20 líneas, scope mínimo ───────────────
  - CKV_AWS_117   # Lambda dentro de VPC (sólo llama SNS público)
  - CKV_AWS_116   # DLQ (Alertmanager reintenta)
  - CKV_AWS_272   # Code-signing (overkill)
  - CKV_AWS_258   # Function URL AuthType=NONE (sólo Alertmanager interno la conoce)

  # ─── Bucket S3 transitorio para payloads SSM de Ansible ────────────────────
  - CKV_AWS_18    # Access logging
  - CKV_AWS_21    # Versioning
  - CKV_AWS_144   # Cross-region replication
  - CKV2_AWS_61   # Lifecycle (objetos efímeros)
  - CKV2_AWS_62   # Event notifications
